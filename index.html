<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一起回佳">
<meta name="application-name" content="一起回佳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>一起回佳｜佳里半日行 2026.11.18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style id="appStyle">
:root{
  --cream:#F3EEE3; --brick:#963F32; --gold:#C2A36D; --char:#39352F;
  --olive:#606B4C; --sand:#D9CDBB;
  --brick-d:#7c3228; --olive-l:#e4e6dc; --line:rgba(57,53,47,.12);
  --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#e9e2d4;color:var(--char);font-family:var(--sans);font-size:15px;line-height:1.65}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-b));box-shadow:0 0 40px rgba(57,53,47,.08)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--char)}

/* ===== Header ===== */
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,238,227,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-weight:900;color:var(--brick);font-size:20px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.brand .seal{height:32px;padding:0 14px;border-radius:8px;background:var(--brick);color:var(--cream);display:grid;place-items:center;font-size:16px;letter-spacing:.12em}
.top-meta{font-size:12px;color:var(--olive);text-align:right;line-height:1.35}
.top-meta b{color:var(--brick);font-size:13px}

/* ===== Tabs ===== */
.tab{display:none;animation:fade .35s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{padding:26px 20px 22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--serif);font-weight:900;margin:0;font-size:28px;letter-spacing:.06em;line-height:1.3}
.hero p{margin:6px 0 0;font-size:13.5px;opacity:.9}
.hero .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:22px solid rgba(255,255,255,.08)}
.hero.olive{background:var(--olive);color:var(--cream)}
.hero.brick{background:var(--brick);color:var(--cream)}
.hero.char{background:var(--char);color:var(--cream)}
.hero.cream{background:var(--cream);color:var(--brick);border-bottom:1px solid var(--line)}
.hero.cream::after{border-color:rgba(194,163,109,.18)}

.section{padding:18px 16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 0}
.btn{border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .1s, background .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--brick);color:var(--cream)}
.btn-primary:active{background:var(--brick-d)}
.btn-ghost{background:transparent;color:var(--brick);border:1.5px solid var(--brick)}
.btn-olive{background:var(--olive);color:var(--cream)}
.btn-soft{background:var(--sand);color:var(--char)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%;justify-content:center}
.map-btn{background:var(--brick);color:var(--cream);border:none;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.map-btn:active{background:var(--brick-d)}
.link-btn{background:var(--cream);color:var(--olive);border:1.5px solid var(--olive);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}

/* ===== Trip summary ===== */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.summary div{background:rgba(243,238,227,.14);border-radius:12px;padding:8px 6px;text-align:center}
.summary b{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.03em}
.summary span{font-size:11px;opacity:.8}
.hero-title{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.countdown.ended{background:rgba(243,238,227,.22);color:var(--cream)}
.countdown{display:inline-block;margin-top:2px;background:var(--gold);color:var(--char);font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 12px}

/* ===== Timeline ===== */
.timeline{position:relative;padding:8px 16px 4px 16px}
.stop{display:grid;grid-template-columns:54px 22px 1fr;gap:8px;position:relative}
.stop .time{font-family:var(--serif);font-weight:900;color:var(--olive);font-size:16px;text-align:right;padding-top:14px}
.stop .rail{position:relative}
.stop .rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(var(--olive) 0 6px,transparent 6px 11px);opacity:.55}
.stop:first-child .rail::before{top:20px}
.stop.last .rail::before{bottom:auto;height:20px}
.stop .dot{position:absolute;left:0;top:14px;width:22px;height:22px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:11px;box-shadow:0 0 0 4px var(--cream)}
.stop .card{background:#fff;border-radius:16px;padding:12px 14px;margin:6px 0 10px;box-shadow:0 2px 10px rgba(57,53,47,.06);border:1px solid var(--line)}
.stop .name{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--char);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.chip{background:var(--olive-l);color:var(--olive);font-size:12.5px;padding:2px 10px;border-radius:999px;font-weight:500}
.chip.brick{background:#f1e2df;color:var(--brick)}
.chip.gold{background:#f3ebdc;color:#8a6d36}
.mode{font-size:12px;color:#fff;background:var(--char);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px;font-family:var(--sans);font-weight:500}
.addr{font-size:12.5px;color:#7a7368;margin:2px 0 10px}
.stay{font-size:11.5px;color:var(--olive);margin-top:-4px;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.end-mark{display:grid;grid-template-columns:54px 22px 1fr;gap:8px;padding:0 16px 10px}
.end-mark .time{font-family:var(--serif);font-weight:900;color:var(--brick);font-size:16px;text-align:right}
.end-mark .flag{width:22px;height:22px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-size:11px}
.end-mark .txt{font-weight:700;color:var(--brick);font-family:var(--serif)}

/* ===== Edit forms ===== */
.edit-card{background:#fff;border:1.5px dashed var(--olive);border-radius:16px;padding:12px;margin:0 16px 12px}
.edit-card .row{display:flex;gap:8px;margin-bottom:8px}
.edit-card label{font-size:11.5px;color:var(--olive);font-weight:700;display:block;margin-bottom:2px}
.field{flex:1;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--sand);background:var(--cream);border-radius:10px;padding:8px 10px;outline:none}
.field textarea{resize:vertical;min-height:64px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--olive);background:#fff}
.edit-tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.icon-btn{border:none;background:var(--sand);color:var(--char);width:34px;height:34px;border-radius:10px;font-size:15px;display:grid;place-items:center}
.icon-btn.danger{background:#f1e2df;color:var(--brick)}
.hint{font-size:12.5px;color:#7a7368;padding:0 16px;margin:10px 0}
.edit-banner{margin:12px 16px 8px;background:#f3ebdc;border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:13px;color:#6b5428}

/* ===== Packing ===== */
.progress-wrap{position:sticky;top:51px;z-index:10;background:var(--cream);padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-top .label{font-weight:700;font-size:14.5px}
.progress-top .count{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--olive)}
.bar{height:12px;background:var(--sand);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--olive),#7c8a5f);border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.done-msg{margin-top:8px;font-size:13px;color:var(--olive);font-weight:700;display:none}
.done-msg.show{display:block}
.cat-title{font-family:var(--serif);font-weight:700;color:var(--brick);font-size:15px;margin:16px 16px 6px;display:flex;align-items:center;gap:8px}
.cat-title::after{content:"";flex:1;height:1px;background:var(--line)}
.items{padding:0 16px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;user-select:none;transition:background .2s,border-color .2s}
.item .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--sand);display:grid;place-items:center;flex-shrink:0;transition:all .2s;color:transparent;font-weight:900;font-size:15px}
.item .txt{flex:1;font-size:15px}
.item .note{font-size:12px;color:#8b8479;display:block;line-height:1.3}
.item.done{background:#eef0e8;border-color:#cfd5c1}
.item.done .box{background:#4f8a3c;border-color:#4f8a3c;color:#fff;transform:scale(1.05)}
.item.done .txt{color:#6f7a5e;text-decoration:line-through;text-decoration-color:rgba(79,138,60,.5)}
.item .del{display:none}
.managing .item .del{display:grid}
.add-row{display:flex;gap:6px;padding:6px 16px 0}
.add-row input,.add-row select{border:1px solid var(--sand);background:#fff;border-radius:10px;padding:9px 10px;outline:none}
.add-row input{flex:1;min-width:0}

/* ===== Spots ===== */
.spot{margin:0 16px 14px;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 3px 14px rgba(57,53,47,.06)}
.spot-head{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;user-select:none}
.spot-icon{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:24px;color:var(--cream);background-size:cover;background-position:center}
.spot-head .meta{flex:1;min-width:0}
.spot-head .ttl{display:inline-block;font-family:var(--serif);font-weight:900;font-size:16.5px;line-height:1.35;padding:4px 12px;border-radius:8px;margin-bottom:4px;letter-spacing:.04em;color:var(--cream)}
.spot-head{padding:14px 14px 12px}
.spot-head .sub{font-size:12.5px;color:#7a7368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-head .arrow{width:28px;height:28px;border-radius:50%;background:var(--cream);display:grid;place-items:center;transition:transform .3s;color:var(--brick);font-size:12px}
.spot.open .arrow{transform:rotate(180deg)}
.spot-body{max-height:0;overflow:hidden;transition:max-height .45s ease}
.spot.open .spot-body{max-height:4000px}
.spot-inner{padding:0 14px 16px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px 12px;padding:0 14px}
.gallery img{height:180px;max-width:85%;border-radius:12px;object-fit:cover;scroll-snap-align:start;flex-shrink:0}
.cover-empty{border:1.5px dashed var(--sand);border-radius:12px;margin-bottom:12px;padding:12px;text-align:center;font-size:13px;color:#8b8479;background:var(--cream)}
.spot-inner p{margin:0 0 10px;white-space:pre-line}
.story{background:var(--cream);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s;white-space:pre-line;font-size:14.5px}
.story.show{max-height:2000px;padding:12px 14px;margin-bottom:12px}
.story h4{margin:0 0 6px;font-family:var(--serif);color:var(--brick)}
.cat-信仰 .ttl{background:var(--brick)}
.cat-西拉雅 .ttl{background:var(--olive)}
.cat-美食 .ttl{background:var(--sand);color:var(--brick)}
.cat-歷史 .ttl{background:var(--gold);color:var(--char)}
.cat-其他 .ttl{background:var(--char)}
.spot.cat-信仰{border-top:4px solid var(--brick)}
.spot.cat-西拉雅{border-top:4px solid var(--olive)}
.spot.cat-美食{border-top:4px solid var(--sand)}
.spot.cat-歷史{border-top:4px solid var(--gold)}
.spot.cat-其他{border-top:4px solid var(--char)}
.img-edit{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.img-edit div{position:relative}
.img-edit img{width:76px;height:76px;object-fit:cover;border-radius:10px}
.img-edit button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--brick);color:#fff;font-size:12px;line-height:1}
.upload{display:inline-flex;align-items:center;gap:6px;background:var(--olive-l);color:var(--olive);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
.upload input{display:none}
.highlight{animation:hl 1.6s ease}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 3px 14px rgba(57,53,47,.06)}}

/* ===== Intro ===== */
.quote{margin:0;padding:30px 14px 26px;background:var(--cream);text-align:center;position:relative;border-bottom:1px solid var(--line)}
.quote .mark{font-family:var(--serif);font-size:64px;color:var(--gold);line-height:.6;display:block;height:30px}
.quote blockquote{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(14px,4.4vw,19px);line-height:1.9;color:var(--char);letter-spacing:.02em;white-space:nowrap}
.quote blockquote em{font-style:normal;color:var(--brick);font-weight:900;font-size:1.25em}
.quote .by{margin-top:12px;font-size:12px;color:#8a6d36;letter-spacing:.2em}
.chap{margin:16px 16px 0;background:#fff;border-radius:18px;border:1px solid var(--line);overflow:hidden}
.chap-head{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.chap-num{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--gold);line-height:1}
.chap-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:19px;color:var(--brick);letter-spacing:.05em}
.chap-head small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:#8a6d36;letter-spacing:.15em}
.chap-body{padding:4px 16px 16px;white-space:pre-line;font-size:14.8px}
.chap-body b,.chap-body strong{color:var(--brick)}
.map-frame{width:100%;height:220px;border:0;border-radius:12px;display:block;margin-top:6px;background:var(--sand)}
.compass{display:block;margin:4px auto 10px;width:100%;border-radius:14px;box-shadow:0 2px 10px rgba(57,53,47,.08)}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.foodgrid div{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.foodgrid b{display:block;font-family:var(--serif);color:var(--brick);font-size:15px;margin-bottom:2px}

.footer{background:var(--char);color:var(--cream);text-align:center;padding:22px 16px 24px;margin-top:26px;font-size:12px;line-height:1.8}
.footer b{font-family:var(--serif);font-size:16px;letter-spacing:.2em;color:var(--gold)}

/* ===== Bottom nav ===== */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:#fffdf8;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;box-shadow:0 -4px 18px rgba(57,53,47,.06)}
.nav button{background:none;border:none;color:#9a9286;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active{color:var(--brick)}
.nav button.active::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--brick)}
.nav .badge{position:absolute;top:8px;right:calc(50% - 22px);background:var(--olive);color:#fff;font-size:9.5px;border-radius:999px;padding:0 5px;line-height:15px}

/* ===== Splash & modal ===== */
.splash{position:fixed;inset:0;z-index:100;background:var(--brick);color:var(--cream);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .5s, visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash-card{max-width:360px;width:100%;text-align:center;position:relative}
.splash .seal-big{width:92px;height:92px;margin:0 auto 22px;border:3px solid var(--gold);border-radius:18px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:46px;color:var(--gold);transform:rotate(-4deg)}
.splash h1{font-family:var(--serif);font-weight:900;font-size:27px;line-height:1.55;letter-spacing:.12em;margin:0 0 14px}
.splash h1 span{color:var(--gold)}
.splash .info{font-size:13.5px;opacity:.88;margin-bottom:6px;letter-spacing:.05em}
.splash .rule{width:60px;height:2px;background:var(--gold);margin:20px auto}
.splash button{background:var(--cream);color:var(--brick);border:none;border-radius:999px;padding:14px 44px;font-size:16px;font-weight:900;letter-spacing:.15em;font-family:var(--serif);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.splash button:active{transform:scale(.96)}
.splash .deco{position:absolute;inset:0;pointer-events:none;opacity:.12;background:radial-gradient(circle at 15% 20%,var(--gold) 0 2px,transparent 3px) 0 0/34px 34px}

.modal{position:fixed;inset:0;z-index:90;background:rgba(57,53,47,.55);display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-card{background:var(--cream);border-radius:20px;padding:22px 20px 18px;max-width:330px;width:100%;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal-card h3{margin:0 0 6px;font-family:var(--serif);color:var(--brick)}
.modal-card p{margin:0 0 18px;font-size:14px;color:#5e584e}
.modal-card .btns{display:flex;gap:10px}
.modal-card .btns .btn{flex:1;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);background:var(--char);color:var(--cream);padding:9px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:all .3s;z-index:95;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.settings{margin:18px 16px 0;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.settings h4{margin:0 0 8px;font-family:var(--serif);color:var(--char)}
.settings .actions{gap:6px}
body:not(.owner) .owner-only{display:none!important}
body.live .local-only{display:none!important}
.sync-btn{display:none}
body.dirty .sync-btn{display:inline-block}
body.cloud .no-cloud{display:none!important}
.pw-input{width:100%;border:1px solid var(--sand);background:#fff;border-radius:10px;padding:10px 12px;font-size:16px;margin-bottom:14px;outline:none;text-align:center;letter-spacing:.2em}
.owner-bar{display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--char);color:var(--cream);font-size:12.5px;padding:7px 16px}
body.owner .owner-bar{display:flex}
.owner-bar button{background:var(--gold);color:var(--char);border:none;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}

/* ===== 平板（≥768px） ===== */
@media (hover:hover){
  .btn:hover,.map-btn:hover,.link-btn:hover{filter:brightness(1.07)}
  .item:hover{border-color:var(--olive)}
  .spot-head:hover .arrow{background:var(--sand)}

const DATA_KEYS=['days','pack','spots','intro','cats'];
function normalize(d){
  if(!d)return d;
  if(!d.days&&d.trip){const m=d.meta||DEFAULTS.meta;d.days=[{date:m.date,start:m.start,end:m.end,trip:d.trip}];}
  if(!d.cats)d.cats=JSON.parse(JSON.stringify(DEFAULTS.cats));
  delete d.meta;delete d.trip;return d;
}

const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const APP_JS=document.currentScript?document.currentScript.textContent:'';
const APP_CSS=document.getElementById('appStyle').textContent;
const APP_BODY=document.querySelector('.app').outerHTML;
let EMB=null;try{EMB=JSON.parse(document.getElementById('state').textContent);}catch(e){}
const PUBLISHED=/*__DATA__*/null;   // 分享版會把資料寫在這裡，並停用編輯
let CACHE=null;if(CLOUD){try{CACHE=JSON.parse(localStorage.getItem('huijia_cloud_cache')||'null');}catch(e){}}
const PUB=normalize(PUBLISHED||EMB||(CLOUD?(CACHE||JSON.parse(JSON.stringify(DEFAULTS))):null));
let LIVE=false,ART=null,ASSETS=null;
const KEY=PUB?'huijia_pub_':'huijia_v2_';
const clone=o=>JSON.parse(JSON.stringify(o));
function getDone(){try{return JSON.parse(localStorage.getItem(KEY+'done')||'[]');}catch(e){return [];}}
function load(k){
  if(PUB){if(k==='pack'){const d=getDone();return (PUB.pack||DEFAULTS.pack).map(p=>({...p,done:d.includes(p.id)}));}return clone(PUB[k]??DEFAULTS[k]);}
  try{const v=localStorage.getItem(KEY+k);if(v)return JSON.parse(v);
    if(k==='days'){const m=localStorage.getItem(KEY+'meta'),t=localStorage.getItem(KEY+'trip');
      if(t)return normalize({meta:m?JSON.parse(m):DEFAULTS.meta,trip:JSON.parse(t)}).days;}
  }catch(e){}
  return clone(DEFAULTS[k]);}
function save(k){
  if(k==='trip'||k==='meta')k='days';
  if(k!=='pack')markDirty();
  if(PUB){if(k==='pack'){try{localStorage.setItem(KEY+'done',JSON.stringify(S.pack.filter(p=>p.done).map(p=>p.id)));}catch(e){}}return true;}
  try{localStorage.setItem(KEY+k,JSON.stringify(S[k]));return true;}catch(e){toast('⚠️ 儲存空間不足，請減少照片');return false;}}
const S={days:load('days'),pack:load('pack'),spots:load('spots'),intro:load('intro'),cats:load('cats')};
let curDay=0;
function setDay(i){if(!S.days.length)S.days.push({date:DEFAULTS.meta.date,start:'09:00',end:'17:00',trip:[]});
  curDay=Math.max(0,Math.min(i,S.days.length-1));
  Object.defineProperty(S,'meta',{value:S.days[curDay],configurable:true,enumerable:false,writable:true});
  Object.defineProperty(S,'trip',{value:S.days[curDay].trip,configurable:true,enumerable:false,writable:true});}
function ensureCats(){S.spots.forEach(sp=>{if(sp.cat&&!S.cats.some(c=>c.name===sp.cat))S.cats.push({name:sp.cat,color:'#39352F'});});}
function pickData(){const o={};DATA_KEYS.forEach(k=>o[k]=clone(S[k]));o.pack.forEach(p=>p.done=false);return o;}
setDay(0);ensureCats();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK='日一二三四五六';
function mapUrl(addr,mode){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr)+'&travelmode='+(mode==='步行'?'walking':'driving');}
function toMin(t){const [h,m]=(t||'0:0').split(':').map(Number);return h*60+m;}
function splitTags(s){return String(s||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function confirmBox(title,text,yesText){return new Promise(r=>{$('#modalTitle').textContent=title;$('#modalText').textContent=text;$('#modalYes').textContent=yesText||'確定';const m=$('#modal');m.classList.add('show');
  const done=v=>{m.classList.remove('show');$('#modalYes').onclick=$('#modalNo').onclick=null;r(v);};$('#modalYes').onclick=()=>done(true);$('#modalNo').onclick=()=>done(false);});}

/* ================= Meta ================= */
function fmtD(ds){const d=new Date((ds||'2026-01-01')+'T00:00:00');const MM=String(d.getMonth()+1).padStart(2,'0'),DD=String(d.getDate()).padStart(2,'0');
  return {d,md:(d.getMonth()+1)+'/'+d.getDate(),mmdd:MM+'/'+DD,ymd:d.getFullYear()+'-'+MM+'-'+DD,wk:'（'+WEEK[d.getDay()]+'）'};}
function renderMeta(){
  const m=S.meta,f=fmtD(m.date),n=S.days.length;
  if(n>1){const a=fmtD(S.days[0].date),b=fmtD(S.days[n-1].date);$('#topDate').textContent=a.md+'–'+b.md;$('#topTime').textContent='共 '+n+' 天';}
  else{$('#topDate').textContent=f.md+f.wk;$('#topTime').textContent=m.start+'–'+m.end;}
  $('#sumLine').textContent='📅 '+(n>1?'第'+(curDay+1)+'天・':'')+f.ymd+f.wk+' '+m.start+'–'+m.end;
  const sorted=[...S.days].sort((a,b)=>(a.date+(a.end||'')).localeCompare(b.date+(b.end||'')));
  const first=fmtD(sorted[0].date).d,last=sorted[sorted.length-1];
  const lastEnd=new Date(last.date+'T'+(last.end||'23:59')+':00'),now=new Date();
  const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((first-today)/864e5);
  const cd=$('#countdown');cd.classList.toggle('ended',now>lastEnd);
  cd.textContent=now>lastEnd?'已結束':diff>0?'距離出發還有 '+diff+' 天':(n>1?'旅程進行中 🚗':'就是今天！一起回佳 🚗');
}

/* ================= 行程 ================= */
let tripEdit=false;
function spotOptions(sel){return '<option value="">（不連結）</option>'+S.spots.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');}
function renderDayTabs(){
  const box=$('#dayTabs'),n=S.days.length;
  let h=S.days.map((d,i)=>{const f=fmtD(d.date);return `<button class="day-tab ${i===curDay?'active':''}" data-day="${i}">第${i+1}天<small>${f.mmdd}</small></button>`;}).join('');
  h+=`<button class="day-tab add owner-only" id="dayAdd">＋ 新增天數</button>`;
  box.innerHTML=h;box.style.display=(n>1||document.body.classList.contains('owner'))?'':'none';
  box.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{setDay(+b.dataset.day);renderMeta();renderTrip();});
  $('#dayAdd').onclick=()=>{const last=S.days[S.days.length-1];const nd=new Date(last.date+'T00:00:00');nd.setDate(nd.getDate()+1);
    const ds=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
    S.days.push({date:ds,start:'09:00',end:'17:00',trip:[]});setDay(S.days.length-1);save('days');
    if(!tripEdit)$('#tripEditBtn').click();else renderTrip();renderMeta();toast('已新增第'+S.days.length+'天');};
}

  }

          ${sp?`<button class="link-btn" data-goto="${sp.id}">📜 站點介紹</button>`:''}
        </div>
      </div></div>`;});
  h+='</div>';

function bindTripEdit(){
  const v=$('#tripView');

  v.querySelectorAll('.edit-card[data-i]').forEach(card=>{
    const i=+card.dataset.i;
    card.querySelectorAll('[data-f]').forEach(inp=>{inp.oninput=inp.onchange=()=>{S.trip[i][inp.dataset.f]=inp.value;save('trip');};});
    card.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.act;
      if(a==='up'&&i>0){[S.trip[i-1],S.trip[i]]=[S.trip[i],S.trip[i-1]];}
      else if(a==='down'&&i<S.trip.length-1){[S.trip[i+1],S.trip[i]]=[S.trip[i],S.trip[i+1]];}

function compress(file,max=1000,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  let w=img.width,h=img.height;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

let introFilter='';
function renderIntro(){
  let h='';
  if(introFilter&&!S.intro[+introFilter-1])introFilter='';

    h+=`<div class="cat-filter intro-filter"><label class="cf-label" for="introSel">章節</label><div class="cf-sel"><i style="background:var(--gold)"></i><select id="introSel"><option value="">全部章節（${S.intro.length}）</option>`+
      S.intro.map((c,i)=>`<option value="${i+1}" ${introFilter==String(i+1)?'selected':''}>${String(i+1).padStart(2,'0')}　${esc(c.title)}</option>`).join('')+`</select></div></div>`;
  }else{
    h+=`<div class="edit-banner" style="grid-column:1/-1;margin:0 0 4px">編輯模式：可修改標題、英文副標與內文，用 ↑↓ 調整順序，最下方可新增章節。按「完成」同步。</div>`;
  }
  S.intro.forEach((c,i)=>{
    if(!introEdit&&introFilter&&introFilter!=String(i+1))return;
    const wide=c.key==='geo'||(introFilter&&!introEdit);
    h+=`<article class="chap${wide?' wide':''}" id="chap-${i}"><div class="chap-head"><div class="chap-num">${String(i+1).padStart(2,'0')}</div><h2>${esc(c.title)}<small>${esc(c.en||'')}</small></h2></div>`;
    if(introEdit){
      h+=`<div style="padding:4px 16px 16px"><div class="row" style="display:flex;gap:8px;margin-bottom:8px"><div class="field"><label>標題</label><input data-ii="${i}" data-k="title" value="${esc(c.title)}"></div>
        <div class="field" style="flex:.8"><label>英文副標（可空白）</label><input data-ii="${i}" data-k="en" value="${esc(c.en||'')}"></div></div>
        <div class="field"><label>內文</label><textarea data-ii="${i}" data-k="body" rows="8">${esc(c.body)}</textarea></div>
        <div class="edit-tools"><button class="icon-btn" data-im="up" data-i="${i}">↑</button><button class="icon-btn" data-im="down" data-i="${i}">↓</button><button class="icon-btn danger" data-im="del" data-i="${i}">🗑</button></div></div>`;
    }else{
      h+=`<div class="chap-body">${esc(c.body)}</div>`;
    }
    if(c.key==='geo'){h+=`<div class="geo-extra" style="padding:0 16px 16px">${COMPASS}
      <iframe class="map-frame local-only" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent('臺南市佳里區')}&z=12&output=embed" title="佳里區地圖"></iframe>
      <div class="actions geo-act" style="margin-top:10px"><a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('臺南市佳里區')}" target="_blank" rel="noopener">📍 在 Google Map 開啟佳里</a></div></div>`;}
    h+='</article>';
  });
  if(introEdit)h+=`<div style="grid-column:1/-1"><button class="btn btn-olive btn-block" id="introAdd">＋ 新增章節</button></div>`;
  const v=$('#introView');v.innerHTML=h;
  v.querySelectorAll('[data-ii]').forEach(inp=>inp.oninput=()=>{S.intro[+inp.dataset.ii][inp.dataset.k]=inp.value;save('intro');});
  v.querySelectorAll('[data-im]').forEach(btn=>btn.onclick=async()=>{const i=+btn.dataset.i,a=btn.dataset.im;
    if(a==='up'&&i>0)[S.intro[i-1],S.intro[i]]=[S.intro[i],S.intro[i-1]];
    else if(a==='down'&&i<S.intro.length-1)[S.intro[i+1],S.intro[i]]=[S.intro[i],S.intro[i+1]];
    else if(a==='del'){if(!await confirmBox('刪除這個章節？','「'+(S.intro[i].title||'未命名')+'」的標題與內文都會刪除'+(S.intro[i].key==='geo'?'，手繪地圖也會一起移除':'')+'。','刪除'))return;S.intro.splice(i,1);}
    else return;
    save('intro');renderIntro();});
  if($('#introAdd'))$('#introAdd').onclick=()=>{S.intro.push({key:'c'+Date.now(),title:'新章節',en:'',body:''});save('intro');renderIntro();

const HEAD='<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="theme-color" content="#F3EEE3">\n<title>一起回佳｜佳里 2026.11.18</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">\n';

async function publishLive(){
  if(CLOUD)return cloudSave();
  if(!LIVE||!ART||!document.body.classList.contains('owner')||publishing)return;
  publishing=true;toast('☁️ 同步中…');
  const data=pickData();
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const html='<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n'+HEAD+'<style id="appStyle">'+APP_CSS+'</style>\n</head>\n<body>\n'+APP_BODY+
    '\n<script type="application/json" id="state">'+json+'<\/script>\n<script>'+APP_JS+'<\/script>\n</body>\n</html>';
  try{await ART.publish(html);dirty=false;document.body.classList.remove('dirty');toast('✓ 已同步，大家都看得到了');}
  catch(e){const c=String((e&&(e.code||e.message))||e);
    if(/conflict/i.test(c))toast('內容剛被更新，重新載入中…');
    else if(/not_granted|not_writer/i.test(c)){toast('你沒有編輯權限');document.body.classList.remove('owner');}
    else toast('⚠️ 同步失敗，請再按一次「立即同步」');}
  publishing=false;
}

/* ================= 雲端同步（Google Apps Script） ================= */
function getPw(){try{return localStorage.getItem('huijia_cloud_pw')||'';}catch(e){return '';}}
async function api(body){
  const opt=body?{method:'POST',body:JSON.stringify(body)}:{cache:'no-store'};
  const url=body?API_URL:API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now();
  return (await fetch(url,opt)).json();
}
let cloudVer=null;
function isBusy(){return tripEdit||packManage||introEdit||editingSpot||catManage||dirty||publishing;}
function applyData(d){
  d=normalize(d);['days','spots','intro','cats'].forEach(k=>{if(d[k])S[k]=d[k];});setDay(curDay);ensureCats();
  if(d.pack){const done=getDone();S.pack=d.pack.map(p=>({...p,done:done.includes(p.id)}));}
  try{localStorage.setItem('huijia_cloud_cache',JSON.stringify(d));}catch(e){}
  renderAll();
}
async function cloudFetch(first){
  if(!CLOUD||isBusy())return;
  try{
    if(!first){const v=await (await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'action=version&t='+Date.now(),{cache:'no-store'})).json();if(v.version===cloudVer)return;}
    const r=await api();if(!r.ok)return;
    if(isBusy())return;
    cloudVer=r.version;if(r.data)applyData(r.data);
  }catch(e){}
}
async function cloudSave(){
  if(!document.body.classList.contains('owner')||publishing)return;
  publishing=true;toast('☁️ 同步中…');
  const data=pickData();
  try{
    const r=await api({action:'save',pw:getPw(),data});
    if(r.ok){dirty=false;document.body.classList.remove('dirty');cloudVer=r.version||cloudVer;
      try{localStorage.setItem('huijia_cloud_cache',JSON.stringify(data));}catch(e){}toast('✓ 已同步，大家都看得到了');}
    else if(r.error==='wrong_password'){toast('密碼錯誤，請重新登入');setOwner(false);}
    else toast('⚠️ 同步失敗，請按「立即同步」再試');
  }catch(e){toast('⚠️ 網路不穩，請按「立即同步」再試');}
  publishing=false;
}

  document.body.classList.add('cloud');

}

const TABC={'行程':'#606B4C','站點':'#39352F','來「佳」':'#C2A36D','行李':'#963F32'};
function flash(el){if(!el)return;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:'smooth'});el.classList.remove('highlight');void el.offsetWidth;el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),1700);}
function searchIndex(){
  const out=[];
  S.days.forEach((d,di)=>d.trip.forEach((t,i)=>out.push({tab:'行程',title:(S.days.length>1?'第'+(di+1)+'天 ':'')+t.time+' '+t.name,text:[t.name,t.act,t.addr,t.mode].join('　'),
    go:()=>{switchTab('trip');setDay(di);renderMeta();renderTrip();setTimeout(()=>flash($('#stop-'+i+' .card')),60);}})));
  S.spots.forEach(s=>out.push({tab:'站點',title:s.name,text:[s.name,s.cat,s.tags,s.intro,s.story,s.addr].join('　'),go:()=>gotoSpot(s.id)}));
  S.intro.forEach((c,i)=>out.push({tab:'來「佳」',title:c.title,text:c.title+'　'+c.body,go:()=>{switchTab('intro');setTimeout(()=>flash($('#chap-'+i)),60);}}));
  S.pack.forEach(p=>out.push({tab:'行李',title:p.name,text:[p.cat,p.name,p.note].join('　'),go:()=>{switchTab('pack');setTimeout(()=>flash(document.querySelector('.item[data-id="'+p.id+'"]')),60);}}));
  return out;
}
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function doSearch(){
  const q=$('#searchInput').value.trim(),box=$('#searchResults');
  if(!q){box.innerHTML='<div class="s-empty">輸入關鍵字，例如：金唐殿、菜燕、步道、停車</div>';return;}
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const res=searchIndex().filter(r=>{const t=r.text.toLowerCase();return terms.every(x=>t.includes(x));});
  if(!res.length){box.innerHTML='<div class="s-empty">找不到「'+esc(q)+'」相關的內容</div>';return;}
  const rx=new RegExp('('+terms.map(t=>reEsc(esc(t))).join('|')+')','gi');
  box.innerHTML='<div class="s-count">找到 '+res.length+' 筆</div>'+res.map((r,k)=>{
    const flat=r.text.replace(/\s+/g,' ');const pos=Math.max(0,flat.toLowerCase().indexOf(terms[0]));
    const st=Math.max(0,pos-22),snip=(st>0?'…':'')+flat.slice(st,pos+60)+(pos+60<flat.length?'…':'');
    return `<button class="s-item" data-k="${k}"><span class="s-tab" style="background:${TABC[r.tab]}">${r.tab}</span><span class="s-title">${esc(r.title).replace(rx,'<mark>$1</mark>')}</span><div class="s-snip">${esc(snip).replace(rx,'<mark>$1</mark>')}</div></button>`;}).join('');
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{closeSearch();res[+b.dataset.k].go();});
}
function openSearch(){$('#searchPanel').classList.add('show');doSearch();setTimeout(()=>$('#searchInput').focus(),50);}
function closeSearch(){$('#searchPanel').classList.remove('show');}
$('#searchBtn').onclick=openSearch;$('#searchClose').onclick=closeSearch;$('#searchInput').oninput=doSearch;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();openSearch();}});

function renderAll(){renderMeta();renderTrip();renderPack();renderSpots();renderIntro();if(catManage)renderCatPanel();}
